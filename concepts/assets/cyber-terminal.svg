<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="360" viewBox="0 0 1200 360" role="img" aria-labelledby="title desc">
  <title id="title">Pavel Chegodaev cyber terminal</title>
  <desc id="desc">Animated terminal-style banner about 1C architecture and AI tools</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#070b14"/><stop offset="0.55" stop-color="#0d1625"/><stop offset="1" stop-color="#140b24"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop stop-color="#00f5d4"><animate attributeName="stop-color" values="#00f5d4;#7b61ff;#00f5d4" dur="6s" repeatCount="indefinite"/></stop>
      <stop offset="1" stop-color="#ff2e88"><animate attributeName="stop-color" values="#ff2e88;#00f5d4;#ff2e88" dur="6s" repeatCount="indefinite"/></stop>
    </linearGradient>
    <pattern id="grid" width="32" height="32" patternUnits="userSpaceOnUse">
      <path d="M32 0H0V32" fill="none" stroke="#28405c" stroke-width="1" opacity=".24"/>
    </pattern>
    <filter id="glow"><feGaussianBlur stdDeviation="5" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
  </defs>
  <rect width="1200" height="360" rx="24" fill="url(#bg)"/>
  <rect width="1200" height="360" rx="24" fill="url(#grid)"/>
  <rect x="28" y="28" width="1144" height="304" rx="16" fill="#090f19" stroke="url(#accent)" stroke-width="2"/>
  <circle cx="58" cy="58" r="6" fill="#ff5f57"/><circle cx="80" cy="58" r="6" fill="#febc2e"/><circle cx="102" cy="58" r="6" fill="#28c840"/>
  <text x="600" y="64" text-anchor="middle" fill="#60758a" font-family="Consolas,monospace" font-size="14">pavel@untru: ~/architecture</text>
  <text x="64" y="118" fill="#00f5d4" font-family="Consolas,monospace" font-size="19">$ whoami</text>
  <text x="64" y="158" fill="#f0f6fc" font-family="Arial,sans-serif" font-size="40" font-weight="700" letter-spacing="1">PAVEL CHEGODAEV</text>
  <text x="64" y="196" fill="#9fb0c3" font-family="Consolas,monospace" font-size="19">Technical Architect · Tech Lead · Open-source builder</text>
  <text x="64" y="246" fill="#ff2e88" font-family="Consolas,monospace" font-size="18">$ mission</text>
  <text x="64" y="282" fill="#d8e4ee" font-family="Consolas,monospace" font-size="20">connect( 1C, AI_AGENTS, DEV_EXPERIENCE );</text>
  <rect x="521" y="264" width="12" height="23" fill="#00f5d4" filter="url(#glow)">
    <animate attributeName="opacity" values="1;0;1" dur="1s" repeatCount="indefinite"/>
  </rect>
  <g fill="none" stroke="url(#accent)" stroke-width="2" opacity=".8" filter="url(#glow)">
    <path d="M860 115h90l40 40h110"/><path d="M820 180h90l50 50h140"/><path d="M890 275h70l35-35h105"/>
  </g>
  <g fill="#0d1117" stroke="#00f5d4" stroke-width="2">
    <circle cx="860" cy="115" r="8"/><circle cx="950" cy="115" r="8"/><circle cx="990" cy="155" r="8"/><circle cx="1100" cy="155" r="8"/>
    <circle cx="820" cy="180" r="8"/><circle cx="910" cy="180" r="8"/><circle cx="960" cy="230" r="8"/><circle cx="1100" cy="230" r="8"/>
    <circle cx="890" cy="275" r="8"/><circle cx="960" cy="275" r="8"/><circle cx="995" cy="240" r="8"/><circle cx="1100" cy="240" r="8"/>
  </g>
</svg>
